[package]
name = "hyphen-pool"
version = "0.1.2"
edition = "2024"
authors = ["Hyphen Contributors"]
license-file = "LICENSE"
description = "Mining pool server for the Hyphen PO-UW v3 chain"

[workspace]

[[bin]]
name = "hyphen-pool-server"
path = "src/bin/pool_server.rs"

[dependencies]
redb = "5.0.0"
async-trait = "0.1.92"
clap = { version = "4.6.8", features = ["derive"] }
courierust = "1.1.3"
hyphen-core = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "951ea013f0b61115632f463cea22850cd972df83" }
hyphen-crypto = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "951ea013f0b61115632f463cea22850cd972df83" }
hyphen-pow = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "951ea013f0b61115632f463cea22850cd972df83" }
hyphen-neural = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "951ea013f0b61115632f463cea22850cd972df83" }
hyphen-transport = { git = "https://github.com/HyphenTeam/Hyphen.git", rev = "951ea013f0b61115632f463cea22850cd972df83" }
rustbinary = { version = "0.1.10", features = ["derive"] }
parking_lot = "0.13.0"
prost = "0.14.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
zeroize = { version = "1.9.2", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
blake3 = "1.8.7"
