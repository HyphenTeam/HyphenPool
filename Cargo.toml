[package]
name = "hyphen-pool"
version = "0.1.1"
edition = "2021"
authors = ["Hyphen Contributors"]
license-file = "LICENSE"
description = "Mining pool server for the Hyphen PO-UW v3 chain"

[workspace]

[[bin]]
name = "hyphen-pool-server"
path = "src/bin/pool_server.rs"

[dependencies]
async-trait = "0.1.91"
clap = { version = "4.6.7", features = ["derive"] }
courierust = "1.0.9"
hyphen-core = { path = "../crates/hyphen-core" }
hyphen-crypto = { path = "../crates/hyphen-crypto" }
hyphen-pow = { path = "../crates/hyphen-pow" }
hyphen-neural = { path = "../crates/hyphen-neural" }
hyphen-transport = { path = "../crates/hyphen-transport" }
rustbinary = { version = "0.1.8", features = ["derive"] }
parking_lot = "0.12"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1"
zeroize = { version = "1.9.0", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
blake3 = "1.8.7"