[package]
name = "hyphen-pool"
version = "0.1.0"
edition = "2021"
authors = ["Hyphen Contributors"]
license = "PolyForm-Strict-1.0.0"
description = "Mining pool server for the Hyphen PO-UW v3 chain"

[workspace]

[[bin]]
name = "hyphen-pool-server"
path = "src/bin/pool_server.rs"

[dependencies]
async-trait = "0.1.91"
axum = "0.8.9"
clap = { version = "4.6.4", features = ["derive"] }
hyphen-core = { path = "../crates/hyphen-core" }
hyphen-crypto = { path = "../crates/hyphen-crypto" }
hyphen-pow = { path = "../crates/hyphen-pow" }
hyphen-transport = { path = "../crates/hyphen-transport" }
parking_lot = "0.12"
prost = "0.14.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["full"] }
tower-http = { version = "0.7.0", features = ["cors"] }
tracing = "0.1"
zeroize = { version = "1.9.0", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }